# ⚠️ LEGACY — Render deployment se nepoužívá.
# Admin běží jako samostatná Vercel aplikace (rootDir: admin layer).
# Tento soubor je zachován jen pro případ, že by se někdo vrátil k Renderu;
# architektura je 100% Vercel-native (GitHub storage + Vercel Blob + Web3Forms).

services:
  - type: web
    name: ponici-admin
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false
      - key: ADMIN_WEB_URL
        value: https://www.ponici.cz
    disk:
      name: ponici-data
      mountPath: /app/content
      sizeGB: 1
