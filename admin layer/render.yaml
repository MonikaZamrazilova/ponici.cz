# Render.com blueprint — admin vrstva (jedno kliknutí po nahrání na GitHub)
# 1. Repo admin vrstvy nahraj na GitHub (kořen repa = tento adresář).
# 2. Render → New → Blueprint → vyber repo → Deploy.
# 3. Nastav env proměnné (níže). Perzistentní disk /app/content = data.
#
# Obsah: při prvním startu (prázdný disk) se verzovaný content/ z obrazu
# zkopíruje na disk skriptem scripts/seed-content.sh (viz Dockerfile CMD).
# Existující data na disku se nikdy nepřepisují.

services:
  - type: web
    name: ponici-admin
    runtime: docker
    plan: starter # nebo free (usíná po nečinnosti; starter = vždy vzhůru)
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ADMIN_PASSWORD
        sync: false # nastav v dashboardu (silné heslo)
      - key: ADMIN_SESSION_TTL_MS
        value: "86400000"
      - key: ADMIN_RESET_EMAILS
        value: monika.zamrazilova@seznam.cz
      # Odeslání reset kódu e-mailem (EmailJS, server-side) —
      # nastav v dashboardu Renderu (sync: false), nikdy do gitu.
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: ADMIN_WEB_URL
        value: https://www.ponici.cz
    disk:
      name: ponici-data
      mountPath: /app/content
      sizeGB: 1
